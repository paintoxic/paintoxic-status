name: Build & deploy

on:
  push:
    branches: [master]
  schedule:
    # Tuesdays 16:00 UTC — right after the US weekly reset
    - cron: "0 16 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch Raider.io + GitHub data
        run: npm run fetch-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_CONTRIB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}

      - name: Commit refreshed snapshot
        # Keeps "last good data" in git and keeps the repo active so the weekly cron isn't disabled.
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain src/data/snapshot.json)" ]; then
            git config user.name "paintoxic-bot"
            git config user.email "bot@paintoxic.io"
            git add src/data/snapshot.json
            git commit -m "chore(data): refresh snapshot [skip ci]"
            git push
          else
            echo "snapshot unchanged"
          fi

      - uses: actions/configure-pages@v6

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
